<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The character from the room, drawn on a 16px grid so it survives a favicon. -->
  <rect width="16" height="16" fill="#2f2418" />
  <!-- shoulders -->
  <rect x="2" y="11" width="12" height="5" fill="#2e63a6" />
  <rect x="2" y="11" width="12" height="1" fill="#4185d6" />
  <!-- scarf -->
  <rect x="3" y="9" width="10" height="2" fill="#e8543f" />
  <!-- hood -->
  <rect x="4" y="2" width="8" height="8" fill="#4185d6" />
  <rect x="4" y="2" width="8" height="1" fill="#79b2f2" />
  <rect x="4" y="3" width="1" height="6" fill="#79b2f2" />
  <!-- face in shadow, with two catchlights -->
  <rect x="5" y="5" width="6" height="4" fill="#141a28" />
  <rect x="6" y="6" width="1" height="1" fill="#fff0d4" />
  <rect x="9" y="6" width="1" height="1" fill="#fff0d4" />
</svg>
